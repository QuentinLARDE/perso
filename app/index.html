<!-- Stockage 100% local (ce téléphone / ce navigateur uniquement), sans compte ni serveur. -->
<script>
(function () {
  var PREFIX = "assistant-musculation:";
  window.storage = {
    get: function (key, shared) {
      return new Promise(function (resolve, reject) {
        var raw = localStorage.getItem(PREFIX + key);
        if (raw === null) { reject(new Error("not found")); return; }
        resolve({ key: key, value: raw, shared: !!shared });
      });
    },
    set: function (key, value, shared) {
      return new Promise(function (resolve, reject) {
        try {
          localStorage.setItem(PREFIX + key, value);
          resolve({ key: key, value: value, shared: !!shared });
        } catch (e) { reject(e); }
      });
    },
    delete: function (key, shared) {
      return new Promise(function (resolve) {
        localStorage.removeItem(PREFIX + key);
        resolve({ key: key, deleted: true, shared: !!shared });
      });
    },
    list: function (prefix, shared) {
      return new Promise(function (resolve) {
        var p = PREFIX + (prefix || "");
        var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; }).map(function (k) { return k.slice(PREFIX.length); });
        resolve({ keys: keys, prefix: prefix, shared: !!shared });
      });
    }
  };
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>

// Regroupe les séries identiques consécutives (poids, répét. ET repos), ex: 8kg×8, 8kg×8, 8kg×8, 6kg×10 -> "8kg × 8 (×3), 6kg × 10"
function groupSets(sets) {
  const groups = [];
  for (const s of sets) {
    const weight = s.weight || 0, reps = s.reps || 0, rest = s.rest || "";
    const last = groups[groups.length - 1];
    if (last && last.weight === weight && last.reps === reps && last.rest === rest) last.count += 1;
    else groups.push({ weight, reps, rest, count: 1 });
  }
  return groups;
}
const fmtSetGroup = (g) => `${g.weight}kg × ${g.reps}${g.rest ? ` · repos ${g.rest}s` : ""}${g.count > 1 ? ` (×${g.count})` : ""}`;

/* ---------------------------------------------------------------
   Storage hook
----------------------------------------------------------------*/
function useStore() {
  const [config, setConfig] = useState(null);
  const [workouts, setWorkouts] = useState(null);
  const [bodyweight, setBodyweight] = useState(null);
  const [templates, setTemplates] = useState(null);
  const [draft, setDraft] = useState(undefined); // undefined = pas encore chargé, null = aucun brouillon
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      let cfg = DEFAULT_CONFIG;
      try {
        const r = await window.storage.get("config", false);
        if (r && r.value) cfg = JSON.parse(r.value);
      } catch (e) {
        try { await window.storage.set("config", JSON.stringify(DEFAULT_CONFIG), false); }
        catch (e2) { setError("Impossible d'accéder à la mémoire de l'app."); }
      }
      setConfig(cfg);

      let wk = [];
      try {
        const r = await window.storage.get("workouts", false);
        if (r && r.value) wk = JSON.parse(r.value);
      } catch (e) { /* pas de séance encore enregistrée */ }
      setWorkouts(wk);

      let bw = [];
      try {
        const r = await window.storage.get("bodyweight", false);
        if (r && r.value) bw = JSON.parse(r.value);
      } catch (e) { /* pas de pesée encore enregistrée */ }
      setBodyweight(bw);

      let tpl = [];
      try {
        const r = await window.storage.get("templates", false);
        if (r && r.value) tpl = JSON.parse(r.value);
      } catch (e) { /* aucun modèle encore créé */ }
      setTemplates(tpl);

      let dr = null;
      try {
        const r = await window.storage.get("seanceDraft", false);
        if (r && r.value) dr = JSON.parse(r.value);
      } catch (e) { /* aucun brouillon en cours */ }
      setDraft(dr);
    })();
  }, []);

  const saveConfig = useCallback(async (next) => {
    setConfig(next);
    try { await window.storage.set("config", JSON.stringify(next), false); }
    catch (e) { setError("La sauvegarde des réglages a échoué."); }
  }, []);

  const saveWorkouts = useCallback(async (next) => {
    setWorkouts(next);
    try { await window.storage.set("workouts", JSON.stringify(next), false); }
    catch (e) { setError("La sauvegarde de la séance a échoué."); }
  }, []);

  const saveBodyweight = useCallback(async (next) => {
    setBodyweight(next);
    try { await window.storage.set("bodyweight", JSON.stringify(next), false); }
    catch (e) { setError("La sauvegarde du poids a échoué."); }
  }, []);

  const saveTemplates = useCallback(async (next) => {
    setTemplates(next);
    try { await window.storage.set("templates", JSON.stringify(next), false); }
    catch (e) { setError("La sauvegarde des modèles a échoué."); }
  }, []);

  const saveDraft = useCallback(async (next) => {
    setDraft(next);
    try {
      if (next) await window.storage.set("seanceDraft", JSON.stringify(next), false);
      else await window.storage.delete("seanceDraft", false);
    } catch (e) { /* pas bloquant */ }
  }, []);

  return { config, workouts, bodyweight, templates, draft, saveConfig, saveWorkouts, saveBodyweight, saveTemplates, saveDraft, error, setError };
}

/* ---------------------------------------------------------------
   Helpers on data
----------------------------------------------------------------*/
function bestSetOfExerciseBefore(workouts, exerciseId, beforeDate, excludeWorkoutId) {
  let best = null;
  let bestDate = null;
  for (const w of workouts) {
    if (excludeWorkoutId && w.id === excludeWorkoutId) continue;
    if (beforeDate && w.date > beforeDate) continue;
    const ex = w.exercises.find((e) => e.exerciseId === exerciseId);
    if (!ex || ex.sets.length === 0) continue;
    if (!bestDate || w.date > bestDate) { bestDate = w.date; best = ex; }
  }
  return best ? { ...best, date: bestDate } : null;
}

function maxWeightEver(workouts, exerciseId, excludeWorkoutId) {
  let max = 0;
  for (const w of workouts) {
    if (excludeWorkoutId && w.id === excludeWorkoutId) continue;
    const ex = w.exercises.find((e) => e.exerciseId === exerciseId);
    if (!ex) continue;
    for (const s of ex.sets) {
      const wt = parseFloat(s.weight);
      if (!isNaN(wt) && wt > max) max = wt;
    }
  }
  return max;
}

/* =================================================================
   TAB: NOUVELLE SÉANCE
==================================================================*/
function blankDraft(config) {
  return {
    id: uid(), date: todayISO(), sessionTypeId: config.sessionTypes[0]?.id || "", note: "", exercises: [],
    startedAt: Date.now(), durationMinutes: 0, durationManual: false, started: false,
  };
}

function SeanceTab({ config, workouts, saveWorkouts, editingId, setEditingId, draft, saveDraft, chrono, templates }) {
  const editingWorkout = editingId ? workouts.find((w) => w.id === editingId) : null;
  const isEditing = !!editingWorkout;

  // La séance "vivante" : soit une séance passée qu'on modifie, soit le brouillon en cours.
  const base = isEditing ? editingWorkout : (draft || blankDraft(config));

  const [id, setId] = useState(base.id);
  const [date, setDate] = useState(base.date);
  const [sessionTypeId, setSessionTypeId] = useState(base.sessionTypeId);
  const [note, setNote] = useState(base.note || "");
  const [exList, setExList] = useState(base.exercises || []);
  const [exPicker, setExPicker] = useState(false);
  const [exSearch, setExSearch] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [showFractionne, setShowFractionne] = useState(false);
  const [showTemplatePicker, setShowTemplatePicker] = useState(false);
  const [durationMinutes, setDurationMinutes] = useState(String(base.durationMinutes ?? 0));
  const [durationManual, setDurationManual] = useState(isEditing ? true : !!base.durationManual);
  const [startedAt, setStartedAt] = useState(base.startedAt || Date.now());
  const [started, setStarted] = useState(isEditing ? true : !!base.started);

  // Au montage, et à chaque fois qu'on entre/sort du mode édition, on recharge l'état à afficher.
  // Si aucun brouillon n'existait encore, on en crée un et on le persiste immédiatement.
  useEffect(() => {
    if (isEditing) {
      setId(editingWorkout.id); setDate(editingWorkout.date); setSessionTypeId(editingWorkout.sessionTypeId);
      setNote(editingWorkout.note || ""); setExList(editingWorkout.exercises || []);
      setDurationMinutes(String(editingWorkout.durationMinutes ?? 0)); setDurationManual(true);
      setStartedAt(editingWorkout.startedAt || Date.now()); setStarted(true);
    } else if (draft) {
      setId(draft.id); setDate(draft.date); setSessionTypeId(draft.sessionTypeId);
      setNote(draft.note || ""); setExList(draft.exercises || []);
      setDurationMinutes(String(draft.durationMinutes ?? 0)); setDurationManual(!!draft.durationManual);
      setStartedAt(draft.startedAt || Date.now()); setStarted(!!draft.started);
    } else {
      const fresh = blankDraft(config);
      setId(fresh.id); setDate(fresh.date); setSessionTypeId(fresh.sessionTypeId); setNote(""); setExList([]);
      setDurationMinutes("0"); setDurationManual(false); setStartedAt(fresh.startedAt); setStarted(false);
      saveDraft(fresh);
    }
    setConfirmClear(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editingId]);

  const filteredExercises = useMemo(() => {
    let list = config.exercises;
    if (!exSearch) {
      list = list.filter((e) => e.sessionTypeIds.includes(sessionTypeId));
      if (list.length === 0) list = config.exercises;
    } else {
      list = list.filter((e) => e.name.toLowerCase().includes(exSearch.toLowerCase()));
    }
    return list;
  }, [config.exercises, sessionTypeId, exSearch]);

  const addExercise = (exerciseId) => {
    if (exList.find((e) => e.exerciseId === exerciseId)) { setExPicker(false); setExSearch(""); return; }
    setExList((l) => [...l, { exerciseId, tempo: "Normal", tempoCustom: "", sets: [{ reps: "", weight: "", rest: "" }] }]);
    setExPicker(false); setExSearch("");
  };

  const removeExercise = (exerciseId) => setExList((l) => l.filter((e) => e.exerciseId !== exerciseId));

  const updateExercise = (exerciseId, patch) =>
    setExList((l) => l.map((e) => (e.exerciseId === exerciseId ? { ...e, ...patch } : e)));

  const addSet = (exerciseId) => {
    setExList((l) => l.map((e) => {
      if (e.exerciseId !== exerciseId) return e;
      const last = e.sets[e.sets.length - 1];
      const copy = last ? { reps: last.reps, weight: last.weight, rest: last.rest || "" } : { reps: "", weight: "", rest: "" };
      return { ...e, sets: [...e.sets, copy] };
    }));
  };
  const removeSet = (exerciseId, idx) =>
    setExList((l) => l.map((e) => e.exerciseId === exerciseId ? { ...e, sets: e.sets.filter((_, i) => i !== idx) } : e));
  const updateSet = (exerciseId, idx, patch) =>
    setExList((l) => l.map((e) => e.exerciseId === exerciseId
      ? { ...e, sets: e.sets.map((s, i) => i === idx ? { ...s, ...patch } : s) }
      : e));

  const hasContent = exList.some((e) => e.sets.some((s) => s.reps !== "" || s.weight !== ""));

  // Sauvegarde automatique : à chaque changement, on met à jour le brouillon (toujours)
  // et, dès qu'il y a un vrai contenu, on tient la séance à jour dans l'historique/calendrier en direct.
  // La durée est estimée automatiquement (temps écoulé depuis le début) tant qu'elle n'a pas été corrigée à la main.
  useEffect(() => {
    const timer = setTimeout(() => {
      let finalDuration = parseInt(durationMinutes, 10) || 0;
      if (!isEditing && !durationManual) {
        finalDuration = Math.max(0, Math.round((Date.now() - startedAt) / 60000));
        if (finalDuration !== (parseInt(durationMinutes, 10) || 0)) setDurationMinutes(String(finalDuration));
      }

      if (!isEditing) saveDraft({ id, date, sessionTypeId, note, exercises: exList, durationMinutes: finalDuration, durationManual, startedAt, started });

      const cleaned = exList
        .map((e) => ({ ...e, sets: e.sets.filter((s) => s.reps !== "" || s.weight !== "") }))
        .filter((e) => e.sets.length > 0);

      const existingIdx = workouts.findIndex((w) => w.id === id);
      if (cleaned.length > 0) {
        const entry = { id, date, sessionTypeId, note, exercises: cleaned, durationMinutes: finalDuration, durationManual, startedAt };
        if (existingIdx >= 0) {
          if (JSON.stringify(workouts[existingIdx]) !== JSON.stringify(entry)) {
            saveWorkouts(workouts.map((w) => (w.id === id ? entry : w)));
          }
        } else {
          saveWorkouts([...workouts, entry]);
        }
      } else if (existingIdx >= 0) {
        saveWorkouts(workouts.filter((w) => w.id !== id));
      }
    }, 500);
    return () => clearTimeout(timer);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [date, sessionTypeId, note, exList, durationMinutes, durationManual, started]);

  // Démarrage explicite d'une séance : révèle le formulaire et lance le chrono total.
  const beginSession = () => {
    const now = Date.now();
    setStarted(true);
    setStartedAt(now);
    setShowTemplatePicker(false); setShowFractionne(false);
    saveDraft({ id, date, sessionTypeId, note, exercises: exList, durationMinutes: 0, durationManual: false, startedAt: now, started: true });
    chrono.startSession(now);
  };

  // Démarre une séance pré-remplie depuis un modèle enregistré (mêmes exercices/rythme, séries vierges).
  const beginFromTemplate = (tpl) => {
    const now = Date.now();
    const today = todayISO();
    const newExList = tpl.exercises.map((e) => ({
      exerciseId: e.exerciseId, tempo: e.tempo || "Normal", tempoCustom: e.tempoCustom || "",
      sets: [{ reps: "", weight: "", rest: "" }],
    }));
    setStarted(true); setStartedAt(now); setDate(today); setSessionTypeId(tpl.sessionTypeId); setExList(newExList); setNote("");
    setShowTemplatePicker(false); setShowFractionne(false);
    saveDraft({ id, date: today, sessionTypeId: tpl.sessionTypeId, note: "", exercises: newExList, durationMinutes: 0, durationManual: false, startedAt: now, started: true });
    chrono.startSession(now);
  };

  const startNew = () => {
    setEditingId(null);
    const fresh = blankDraft(config);
    saveDraft(fresh);
    setId(fresh.id); setDate(fresh.date); setSessionTypeId(fresh.sessionTypeId); setNote(""); setExList([]);
    setDurationMinutes("0"); setDurationManual(false); setStartedAt(fresh.startedAt); setStarted(false);
    setConfirmClear(false); setShowTemplatePicker(false); setShowFractionne(false);
    chrono.stopSession();
  };

  const clearCurrent = async () => {
    if (workouts.find((w) => w.id === id)) {
      await saveWorkouts(workouts.filter((w) => w.id !== id));
    }
    if (isEditing) setEditingId(null);
    const fresh = blankDraft(config);
    await saveDraft(fresh);
    setId(fresh.id); setDate(fresh.date); setSessionTypeId(fresh.sessionTypeId); setNote(""); setExList([]);
    setDurationMinutes("0"); setDurationManual(false); setStartedAt(fresh.startedAt); setStarted(false);
    setConfirmClear(false); setShowTemplatePicker(false); setShowFractionne(false);
    chrono.stopSession();
  };

  // Si le brouillon est réinitialisé depuis ailleurs (ex. bouton "Arrêter" du chrono), on se resynchronise.
  useEffect(() => {
    if (isEditing || !draft || draft.id === id) return;
    setId(draft.id); setDate(draft.date); setSessionTypeId(draft.sessionTypeId);
    setNote(draft.note || ""); setExList(draft.exercises || []);
    setDurationMinutes(String(draft.durationMinutes ?? 0)); setDurationManual(!!draft.durationManual);
    setStartedAt(draft.startedAt || Date.now()); setStarted(!!draft.started);
    setConfirmClear(false); setShowTemplatePicker(false); setShowFractionne(false);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [draft, isEditing, id]);

  if (!isEditing && !started) {
    if (showFractionne) {
      return <FractionneScreen chrono={chrono} onBack={() => setShowFractionne(false)} />;
    }
    const stById = Object.fromEntries(config.sessionTypes.map((s) => [s.id, s]));

    if (showTemplatePicker) {
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          <button onClick={() => setShowTemplatePicker(false)} style={{
            display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: T.textMuted,
            fontFamily: T.fontBody, fontSize: 13, fontWeight: 600, cursor: "pointer", alignSelf: "flex-start", padding: 0,
          }}>
            <ChevronLeft size={16} /> Retour
          </button>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 20, color: T.text, textTransform: "uppercase", letterSpacing: 0.5 }}>Choisir un modèle</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {templates.map((tpl) => {
              const st = stById[tpl.sessionTypeId];
              const exNames = tpl.exercises.map((e) => config.exercises.find((x) => x.id === e.exerciseId)?.name).filter(Boolean).join(", ");
              return (
                <button key={tpl.id} onClick={() => beginFromTemplate(tpl)} style={{
                  display: "flex", flexDirection: "column", gap: 4, background: T.card, border: `1px solid ${T.border}`,
                  borderRadius: 10, padding: "12px 14px", cursor: "pointer", textAlign: "left",
                }}>
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                    <span style={{ fontFamily: T.fontBody, fontSize: 15, fontWeight: 600, color: T.text }}>{tpl.name}</span>
                    {st && <Tag color={st.color} small>{st.name}</Tag>}
                  </div>
                  {exNames && <span style={{ fontSize: 12, color: T.textFaint, fontFamily: T.fontBody }}>{exNames}</span>}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, padding: "48px 20px", textAlign: "center" }}>
        <Dumbbell size={34} color={T.accent} />
        <div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 20, color: T.text, textTransform: "uppercase", letterSpacing: 0.5 }}>Prêt à t'entraîner ?</div>
          <div style={{ fontSize: 13, color: T.textFaint, fontFamily: T.fontBody, marginTop: 6, maxWidth: 260 }}>Choisis le type de séance à démarrer.</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 260 }}>
          <Btn onClick={beginSession} style={{ padding: "14px 20px", fontSize: 15.5 }}>
            <Dumbbell size={17} /> Séance muscu
          </Btn>
          {templates && templates.length > 0 && (
            <Btn variant="secondary" onClick={() => setShowTemplatePicker(true)} style={{ padding: "14px 20px", fontSize: 15.5 }}>
              <Bookmark size={17} /> Depuis un modèle
            </Btn>
          )}
          <Btn variant="secondary" onClick={() => setShowFractionne(true)} style={{
            padding: "14px 20px", fontSize: 15.5, color: T.fractionne, borderColor: T.fractionne + "66", background: T.fractionneSoft,
          }}>
            <TimerIcon size={17} /> Séance fractionnée
          </Btn>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      {isEditing && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: T.steelSoft, border: `1px solid ${T.steel}55`, borderRadius: 10, padding: "8px 12px" }}>
          <span style={{ fontSize: 13, color: T.steel, fontFamily: T.fontBody, fontWeight: 600 }}>Modification d'une séance passée</span>
          <button onClick={() => setEditingId(null)} style={{ background: "none", border: "none", color: T.steel, cursor: "pointer" }}><X size={16} /></button>
        </div>
      )}

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <Field label="Date">
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, width: 160 }} />
        </Field>
        <Field label={`Durée (min)${!isEditing && !durationManual ? " · auto" : ""}`}>
          <input type="number" inputMode="numeric" min="0" value={durationMinutes}
            onChange={(e) => { setDurationManual(true); setDurationMinutes(e.target.value); }}
            style={{ ...numInputStyle, width: 90 }} />
        </Field>
      </div>

      <Field label="Type de séance">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {config.sessionTypes.map((st) => (
            <button key={st.id} onClick={() => setSessionTypeId(st.id)}
              style={{
                fontFamily: T.fontDisplay, fontWeight: 500, fontSize: 14.5, letterSpacing: 0.4,
                padding: "8px 16px", borderRadius: 9, cursor: "pointer",
                background: sessionTypeId === st.id ? st.color : T.bg2,
                color: sessionTypeId === st.id ? "#fff" : T.textMuted,
                border: `1px solid ${sessionTypeId === st.id ? st.color : T.borderLight}`,
              }}>
              {st.name}
            </button>
          ))}
        </div>
      </Field>

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {exList.map((ex) => {
          const exInfo = config.exercises.find((e) => e.id === ex.exerciseId);
          const last = bestSetOfExerciseBefore(workouts, ex.exerciseId, date, id);
          const maxEver = maxWeightEver(workouts, ex.exerciseId, id);
          return (
            <div key={ex.exerciseId} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div>
                  <div style={{ fontFamily: T.fontDisplay, fontSize: 17, fontWeight: 500, color: T.text }}>{exInfo?.name || "Exercice"}</div>
                  {last && (
                    <div style={{ fontSize: 12, color: T.textFaint, fontFamily: T.fontMono, marginTop: 2 }}>
                      Dernière fois ({fmtDateShort(last.date)}) : {fmtSetsGrouped(last.sets)}
                    </div>
                  )}
                </div>
                <button onClick={() => removeExercise(ex.exerciseId)} style={{ background: "none", border: "none", color: T.textFaint, cursor: "pointer", flexShrink: 0 }}>
                  <Trash2 size={16} />
                </button>
              </div>

              <div style={{ marginTop: 12, display: "flex", gap: 8, flexWrap: "wrap" }}>
                {TEMPO_PRESETS.map((tp) => (
                  <button key={tp} onClick={() => updateExercise(ex.exerciseId, { tempo: tp })}
                    style={{
                      fontSize: 12, fontFamily: T.fontBody, fontWeight: 600, padding: "5px 10px", borderRadius: 999, cursor: "pointer",
                      background: ex.tempo === tp ? T.accentSoft : "transparent",
                      color: ex.tempo === tp ? T.accent : T.textMuted,
                      border: `1px solid ${ex.tempo === tp ? T.accent + "77" : T.borderLight}`,
                    }}>{tp}</button>
                ))}
              </div>
              {ex.tempo === "Personnalisé" && (
                <input value={ex.tempoCustom} onChange={(e) => updateExercise(ex.exerciseId, { tempoCustom: e.target.value })}
                  placeholder="ex : 2s descente / 2s pause / 1s montée"
                  style={{ ...inputStyle, marginTop: 8, fontSize: 13.5 }} />
              )}

              <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
                <div style={{ display: "flex", gap: 8, fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.6, paddingLeft: 30 }}>
                  <span style={{ width: 62 }}>Répét.</span><span style={{ width: 72 }}>Poids (kg)</span><span style={{ width: 62 }}>Repos (s)</span>
                </div>
                {ex.sets.map((s, i) => {
                  const wt = parseFloat(s.weight);
                  const isPR = !isNaN(wt) && wt > 0 && wt > maxEver;
                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ width: 20, fontFamily: T.fontMono, fontSize: 12.5, color: T.textFaint }}>{i + 1}</span>
                      <input type="number" inputMode="numeric" min="0" placeholder="0" value={s.reps}
                        onChange={(e) => updateSet(ex.exerciseId, i, { reps: e.target.value })}
                        style={{ ...numInputStyle, width: 62, padding: "8px 8px" }} />
                      <input type="number" inputMode="decimal" min="0" step="0.5" placeholder="0" value={s.weight}
                        onChange={(e) => updateSet(ex.exerciseId, i, { weight: e.target.value })}
                        style={{ ...numInputStyle, width: 72, padding: "8px 8px" }} />
                      <input type="number" inputMode="numeric" min="0" placeholder="—" value={s.rest || ""}
                        onChange={(e) => updateSet(ex.exerciseId, i, { rest: e.target.value })}
                        style={{ ...numInputStyle, width: 62, padding: "8px 8px", color: T.steel }} />
                      {isPR && <span title="Record personnel" style={{ fontSize: 15 }}>🏆</span>}
                      <button onClick={() => removeSet(ex.exerciseId, i)} style={{ background: "none", border: "none", color: T.textFaint, cursor: "pointer", marginLeft: "auto" }}>
                        <X size={15} />
                      </button>
                    </div>
                  );
                })}
                <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                  <button onClick={() => addSet(ex.exerciseId)} style={{
                    display: "flex", alignItems: "center", gap: 6, background: "none", border: `1px dashed ${T.borderLight}`,
                    borderRadius: 8, padding: "7px 10px", color: T.textMuted, fontFamily: T.fontBody, fontSize: 13, fontWeight: 600,
                    cursor: "pointer", alignSelf: "flex-start",
                  }}>
                    <Copy size={13} /> Ajouter une série
                  </button>
                </div>
              </div>
            </div>
          );
        })}

        {exPicker ? (
          <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <Search size={15} color={T.textFaint} />
              <input autoFocus value={exSearch} onChange={(e) => setExSearch(e.target.value)}
                placeholder="Chercher un exercice…" style={{ ...inputStyle, border: "none", padding: 0, background: "none" }} />
              <button onClick={() => { setExPicker(false); setExSearch(""); }} style={{ background: "none", border: "none", color: T.textFaint, cursor: "pointer" }}><X size={16} /></button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 2, maxHeight: 260, overflowY: "auto" }}>
              {filteredExercises.map((e) => (
                <button key={e.id} onClick={() => addExercise(e.id)}
                  style={{ textAlign: "left", background: "none", border: "none", color: T.text, padding: "9px 8px", borderRadius: 7, cursor: "pointer", fontFamily: T.fontBody, fontSize: 14.5 }}
                  onMouseEnter={(ev) => ev.currentTarget.style.background = T.cardHover}
                  onMouseLeave={(ev) => ev.currentTarget.style.background = "none"}>
                  {e.name}
                </button>
              ))}
              {filteredExercises.length === 0 && <span style={{ color: T.textFaint, fontSize: 13.5, padding: 8 }}>Aucun résultat.</span>}
            </div>
          </div>
        ) : (
          <Btn variant="secondary" onClick={() => setExPicker(true)} style={{ justifyContent: "flex-start" }}>
            <Plus size={16} /> Ajouter un exercice
          </Btn>
        )}
      </div>

      <Field label="Note (optionnel)">
        <textarea value={note} onChange={(e) => setNote(e.target.value)} rows={2}
          placeholder="Forme du jour, sensations…" style={{ ...inputStyle, resize: "vertical", fontFamily: T.fontBody }} />
      </Field>

      <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: hasContent ? T.green : T.textFaint, fontFamily: T.fontBody, fontWeight: 600 }}>
        <Check size={13} /> {hasContent ? "Enregistré automatiquement — modifiable à tout moment depuis Historique ou Calendrier" : "Rien à enregistrer pour l'instant"}
      </div>

      <div style={{ display: "flex", gap: 8 }}>
        {!isEditing && (
          <Btn variant="secondary" onClick={startNew} disabled={!hasContent} style={{ flex: 1, fontSize: 14 }}>
            Terminer, nouvelle séance
          </Btn>
        )}
        {isEditing && (
          <Btn onClick={() => setEditingId(null)} style={{ flex: 1, fontSize: 14 }}>
            <Check size={16} /> Terminer la modification
          </Btn>
        )}
        {confirmClear ? (
          <Btn variant="danger" onClick={clearCurrent} style={{ background: T.accent, color: "#fff", fontSize: 13.5 }}>
            Confirmer l'abandon
          </Btn>
        ) : (
          <Btn variant="danger" onClick={() => setConfirmClear(true)} style={{ fontSize: 13.5 }}>
            <Trash2 size={14} /> Abandonner la séance
          </Btn>
        )}
      </div>
    </div>
  );
}

/* =================================================================
   ÉCRAN DÉDIÉ : SÉANCE FRACTIONNÉE (tout visible, pas de popup)
==================================================================*/
function FractionneScreen({ chrono, onBack }) {
  const {
    intRounds, setIntRounds, intWork, setIntWork, intRest, setIntRest,
    intPhase, intRound, intRemaining, intTotalElapsed, startInterval, stopInterval,
  } = chrono;

  const phaseLabel = { prep: "Préparation", work: "Travail", rest: "Repos", done: "Terminé !" }[intPhase];
  const phaseColor = intPhase === "work" ? T.accent : intPhase === "rest" ? T.steel : intPhase === "done" ? T.green : T.gold;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <button onClick={onBack} style={{
          display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: T.textMuted,
          fontFamily: T.fontBody, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0,
        }}>
          <ChevronLeft size={16} /> Retour
        </button>
        {intPhase !== "idle" && (
          <div title="Durée totale de la séance fractionnée" style={{
            width: 52, height: 52, borderRadius: 999, background: T.fractionneSoft, border: `1px solid ${T.fractionne}66`,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <span style={{ fontFamily: T.fontMono, fontSize: 11.5, fontWeight: 700, color: T.fractionne }}>{fmtClock(intTotalElapsed)}</span>
          </div>
        )}
      </div>

      <div style={{ textAlign: "center", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <TimerIcon size={18} color={T.fractionne} />
        <div style={{ fontFamily: T.fontDisplay, fontSize: 20, color: T.fractionne, textTransform: "uppercase", letterSpacing: 0.5 }}>Séance fractionnée</div>
      </div>

      {intPhase === "idle" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 18, alignItems: "center" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%", maxWidth: 300, background: T.card, border: `1px solid ${T.border}`, borderRadius: 14, padding: 18 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 14, color: T.text, fontFamily: T.fontBody, fontWeight: 600 }}>Tours <span style={{ color: T.textFaint, fontWeight: 400 }}>(max 12)</span></span>
              <input type="number" min="1" max="12" value={intRounds}
                onChange={(e) => setIntRounds(e.target.value)}
                onBlur={(e) => setIntRounds(String(clamp(parseInt(e.target.value, 10) || 8, 1, 12)))}
                style={{ ...numInputStyle, width: 70, textAlign: "center", fontSize: 16 }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 14, color: T.text, fontFamily: T.fontBody, fontWeight: 600 }}>Travail <span style={{ color: T.textFaint, fontWeight: 400 }}>(max 60s)</span></span>
              <input type="number" min="5" max="60" value={intWork}
                onChange={(e) => setIntWork(e.target.value)}
                onBlur={(e) => setIntWork(String(clamp(parseInt(e.target.value, 10) || 30, 5, 60)))}
                style={{ ...numInputStyle, width: 70, textAlign: "center", fontSize: 16 }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <span style={{ fontSize: 14, color: T.text, fontFamily: T.fontBody, fontWeight: 600 }}>Repos <span style={{ color: T.textFaint, fontWeight: 400 }}>(max 60s)</span></span>
              <input type="number" min="0" max="60" value={intRest}
                onChange={(e) => setIntRest(e.target.value)}
                onBlur={(e) => setIntRest(String(clamp(parseInt(e.target.value, 10) || 0, 0, 60)))}
                style={{ ...numInputStyle, width: 70, textAlign: "center", fontSize: 16 }} />
            </div>
          </div>
          <div style={{ fontSize: 12.5, color: T.textFaint, fontFamily: T.fontBody, textAlign: "center", maxWidth: 280 }}>
            10 secondes de préparation avant le premier tour. Bip long au début de chaque travail, bip court au début de chaque repos.
          </div>
          <Btn onClick={startInterval} style={{ padding: "14px 30px", fontSize: 16 }}>
            <Play size={18} /> Lancer
          </Btn>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 18, alignItems: "center", padding: "20px 0" }}>
          <div style={{ fontFamily: T.fontBody, fontSize: 15, fontWeight: 700, color: phaseColor, textTransform: "uppercase", letterSpacing: 0.8 }}>
            {phaseLabel}
          </div>
          {intPhase !== "prep" && intPhase !== "done" && (
            <div style={{ fontFamily: T.fontMono, fontSize: 15, color: T.textMuted }}>Tour {intRound} / {intRounds}</div>
          )}
          <div style={{ fontFamily: T.fontMono, fontSize: 76, fontWeight: 700, color: phaseColor, lineHeight: 1 }}>
            {intPhase === "done" ? "🎉" : fmtClock(intRemaining)}
          </div>
          <Btn variant="danger" onClick={intPhase === "done" ? () => { stopInterval(); onBack(); } : stopInterval} style={{ padding: "12px 26px", fontSize: 15 }}>
            {intPhase === "done" ? "Terminer" : "Arrêter"}
          </Btn>
        </div>
      )}
    </div>
  );
}


function HistoriqueTab({ config, workouts, saveWorkouts, onEdit, onDuplicate, onSaveAsTemplate }) {
  const [openId, setOpenId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const sorted = [...workouts].sort((a, b) => b.date.localeCompare(a.date));
  const stById = Object.fromEntries(config.sessionTypes.map((s) => [s.id, s]));
  const exById = Object.fromEntries(config.exercises.map((e) => [e.id, e]));

  const del = async (id) => {
    await saveWorkouts(workouts.filter((w) => w.id !== id));
    setConfirmDelete(null);
  };

  if (sorted.length === 0) {
    return <EmptyState icon={<History size={30} color={T.textFaint} />} text="Aucune séance enregistrée pour l'instant. Ta première séance apparaîtra ici." />;
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {sorted.map((w) => {
        const st = stById[w.sessionTypeId];
        const isOpen = openId === w.id;
        return (
          <div key={w.id} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, overflow: "hidden" }}>
            <button onClick={() => setOpenId(isOpen ? null : w.id)}
              style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: 14, background: "none", border: "none", cursor: "pointer" }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-start" }}>
                <span style={{ fontFamily: T.fontMono, fontSize: 12.5, color: T.textMuted, textTransform: "capitalize" }}>{fmtDate(w.date)}</span>
                {st && <Tag color={st.color}>{st.name}</Tag>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 12.5, color: T.textFaint, fontFamily: T.fontBody }}>
                  {w.exercises.length} exo{w.exercises.length > 1 ? "s" : ""}{w.durationMinutes ? ` · ${fmtDuration(w.durationMinutes)}` : ""}
                </span>
                {isOpen ? <ChevronUp size={17} color={T.textFaint} /> : <ChevronDown size={17} color={T.textFaint} />}
              </div>
            </button>
            {isOpen && (
              <div style={{ padding: "0 14px 14px", display: "flex", flexDirection: "column", gap: 12 }}>
                {w.exercises.map((ex, i) => (
                  <div key={i} style={{ borderTop: `1px solid ${T.border}`, paddingTop: 10 }}>
                    <div style={{ fontFamily: T.fontDisplay, fontSize: 15.5, color: T.text, fontWeight: 500 }}>
                      {exById[ex.exerciseId]?.name || "Exercice supprimé"}
                    </div>
                    <div style={{ fontSize: 12, color: T.textFaint, fontFamily: T.fontBody, marginBottom: 4 }}>
                      Rythme : {ex.tempo === "Personnalisé" ? ex.tempoCustom || "personnalisé" : ex.tempo}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {groupSets(ex.sets).map((g, si) => (
                        <span key={si} style={{ fontFamily: T.fontMono, fontSize: 13, background: T.bg2, border: `1px solid ${T.borderLight}`, borderRadius: 7, padding: "3px 8px", color: T.text }}>
                          {fmtSetGroup(g)}
                        </span>
                      ))}
                    </div>
                  </div>
                ))}
                {w.note && <div style={{ fontSize: 13, color: T.textMuted, fontStyle: "italic", fontFamily: T.fontBody, borderTop: `1px solid ${T.border}`, paddingTop: 10 }}>{w.note}</div>}
                <div style={{ display: "flex", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                  <Btn variant="secondary" onClick={() => onEdit(w.id)} style={{ flex: 1, fontSize: 13.5, padding: "9px 12px" }}>
                    <Pencil size={14} /> Modifier
                  </Btn>
                  <Btn variant="secondary" onClick={() => onDuplicate(w)} style={{ flex: 1, fontSize: 13.5, padding: "9px 12px" }}>
                    <Copy size={14} /> Réutiliser
                  </Btn>
                  <Btn variant="secondary" onClick={() => onSaveAsTemplate(w)} style={{ flex: 1, fontSize: 13.5, padding: "9px 12px" }}>
                    <Bookmark size={14} /> Modèle
                  </Btn>
                  {confirmDelete === w.id ? (
                    <Btn variant="danger" onClick={() => del(w.id)} style={{ flex: 1, fontSize: 13.5, padding: "9px 12px", background: T.accent, color: "#fff" }}>
                      Confirmer la suppression
                    </Btn>
                  ) : (
                    <Btn variant="danger" onClick={() => setConfirmDelete(w.id)} style={{ fontSize: 13.5, padding: "9px 12px" }}>
                      <Trash2 size={14} />
                    </Btn>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* =================================================================
   TAB: CALENDRIER
==================================================================*/
function CalendrierTab({ config, workouts, bodyweight, onEdit }) {
  const [view, setView] = useState("semaine"); // "semaine" | "mois"
  const [cursor, setCursor] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [weekAnchor, setWeekAnchor] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);
  const stById = Object.fromEntries(config.sessionTypes.map((s) => [s.id, s]));
  const exById = Object.fromEntries(config.exercises.map((e) => [e.id, e]));

  const byDate = useMemo(() => {
    const m = {};
    for (const w of workouts) { (m[w.date] = m[w.date] || []).push(w); }
    return m;
  }, [workouts]);

  const bwByDate = useMemo(() => Object.fromEntries(bodyweight.map((b) => [b.date, b.weight])), [bodyweight]);

  const isoOfDate = (d) => {
    const c = new Date(d); c.setMinutes(c.getMinutes() - c.getTimezoneOffset());
    return c.toISOString().slice(0, 10);
  };
  const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
  const startOfWeek = (d) => { const day = (d.getDay() + 6) % 7; return addDays(d, -day); };

  // --- Vue mois ---
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const monthLabel = cursor.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const isoOfDay = (d) => `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  // --- Vue semaine ---
  const weekStart = startOfWeek(weekAnchor);
  const weekDays = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const weekLabel = `${weekStart.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} – ${addDays(weekStart, 6).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" })}`;

  const selectedWorkouts = selectedDate ? (byDate[selectedDate] || []) : [];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", gap: 4, background: T.bg2, borderRadius: 999, padding: 3, alignSelf: "flex-start" }}>
        {[["semaine", "Semaine"], ["mois", "Mois"]].map(([v, label]) => (
          <button key={v} onClick={() => setView(v)} style={{
            fontSize: 12.5, fontFamily: T.fontBody, fontWeight: 700, padding: "6px 14px", borderRadius: 999, cursor: "pointer",
            background: view === v ? T.accent : "transparent", color: view === v ? "#fff" : T.textMuted, border: "none",
          }}>{label}</button>
        ))}
      </div>

      {view === "mois" ? (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <button onClick={() => setCursor(new Date(year, month - 1, 1))} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, cursor: "pointer" }}><ChevronLeft size={17} /></button>
            <span style={{ fontFamily: T.fontDisplay, fontSize: 18, textTransform: "capitalize", color: T.text }}>{monthLabel}</span>
            <button onClick={() => setCursor(new Date(year, month + 1, 1))} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, cursor: "pointer" }}><ChevronRight size={17} /></button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {["L", "M", "M", "J", "V", "S", "D"].map((d, i) => (
              <div key={i} style={{ textAlign: "center", fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, fontWeight: 600 }}>{d}</div>
            ))}
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const iso = isoOfDay(d);
              const dayWorkouts = byDate[iso] || [];
              const isToday = iso === todayISO();
              const isSelected = iso === selectedDate;
              return (
                <button key={i} onClick={() => setSelectedDate(iso)}
                  style={{
                    aspectRatio: "1", borderRadius: 9, border: `1px solid ${isSelected ? T.accent : isToday ? T.borderLight : "transparent"}`,
                    background: isSelected ? T.accentSoft : T.card, cursor: "pointer",
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, padding: 2,
                  }}>
                  <span style={{ fontFamily: T.fontMono, fontSize: 12.5, color: isToday ? T.accent : T.textMuted }}>{d}</span>
                  <div style={{ display: "flex", gap: 2, flexWrap: "wrap", justifyContent: "center", alignItems: "center" }}>
                    {dayWorkouts.slice(0, 3).map((w, wi) => (
                      <span key={wi} style={{ width: 5, height: 5, borderRadius: 999, background: stById[w.sessionTypeId]?.color || T.textFaint }} />
                    ))}
                    {bwByDate[iso] != null && <Scale size={8} color={T.gold} />}
                  </div>
                </button>
              );
            })}
          </div>
        </>
      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <button onClick={() => setWeekAnchor(addDays(weekAnchor, -7))} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, cursor: "pointer" }}><ChevronLeft size={17} /></button>
            <span style={{ fontFamily: T.fontDisplay, fontSize: 16.5, textTransform: "capitalize", color: T.text }}>{weekLabel}</span>
            <button onClick={() => setWeekAnchor(addDays(weekAnchor, 7))} style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 8, padding: 8, color: T.text, cursor: "pointer" }}><ChevronRight size={17} /></button>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {weekDays.map((d, i) => {
              const iso = isoOfDate(d);
              const dayWorkouts = byDate[iso] || [];
              const isToday = iso === todayISO();
              const isSelected = iso === selectedDate;
              const dayLabel = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
              return (
                <button key={i} onClick={() => setSelectedDate(iso)} style={{
                  display: "flex", alignItems: "center", gap: 10, textAlign: "left",
                  background: isSelected ? T.accentSoft : T.card, border: `1px solid ${isSelected ? T.accent : isToday ? T.borderLight : T.border}`,
                  borderRadius: 10, padding: "10px 12px", cursor: "pointer",
                }}>
                  <span style={{ width: 78, flexShrink: 0, fontFamily: T.fontMono, fontSize: 12, color: isToday ? T.accent : T.textMuted, textTransform: "capitalize" }}>{dayLabel}</span>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", flex: 1 }}>
                    {dayWorkouts.length === 0 ? (
                      <span style={{ fontSize: 12.5, color: T.textFaint, fontFamily: T.fontBody }}>—</span>
                    ) : dayWorkouts.map((w) => {
                      const st = stById[w.sessionTypeId];
                      return st ? (
                        <Tag key={w.id} color={st.color} small>{st.name}{w.durationMinutes ? ` · ${fmtDuration(w.durationMinutes)}` : ""}</Tag>
                      ) : null;
                    })}
                    {bwByDate[iso] != null && (
                      <span style={{ display: "flex", alignItems: "center", gap: 3, fontFamily: T.fontMono, fontSize: 11.5, color: T.gold, fontWeight: 700 }}>
                        <Scale size={11} /> {bwByDate[iso]}kg
                      </span>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </>
      )}

      {selectedDate && (
        <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontFamily: T.fontMono, fontSize: 12.5, color: T.textMuted, textTransform: "capitalize" }}>{fmtDate(selectedDate)}</div>
            {bwByDate[selectedDate] != null && (
              <span style={{ display: "flex", alignItems: "center", gap: 5, fontFamily: T.fontMono, fontSize: 13, color: T.gold, fontWeight: 700 }}>
                <Scale size={13} /> {bwByDate[selectedDate]}kg
              </span>
            )}
          </div>
          {selectedWorkouts.length === 0 ? (
            <span style={{ color: T.textFaint, fontSize: 13.5, fontFamily: T.fontBody }}>Pas de séance ce jour-là.</span>
          ) : selectedWorkouts.map((w) => {
            const st = stById[w.sessionTypeId];
            return (
              <div key={w.id} style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    {st && <Tag color={st.color}>{st.name}</Tag>}
                    {w.durationMinutes ? (
                      <span style={{ fontSize: 12, fontFamily: T.fontMono, color: T.textMuted }}>{fmtDuration(w.durationMinutes)}</span>
                    ) : null}
                  </div>
                  <button onClick={() => onEdit(w.id)} style={{ background: "none", border: "none", color: T.steel, cursor: "pointer", fontSize: 12.5, fontFamily: T.fontBody, fontWeight: 600 }}>Modifier</button>
                </div>
                {w.exercises.map((ex, i) => (
                  <div key={i} style={{ fontSize: 13, fontFamily: T.fontBody, color: T.textMuted }}>
                    <span style={{ color: T.text }}>{exById[ex.exerciseId]?.name}</span> — {fmtSetsGrouped(ex.sets)}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* =================================================================
   TAB: PROGRESSION
==================================================================*/
function ProgressionTab({ config, workouts }) {
  const exercisesWithData = useMemo(() => {
    const ids = new Set();
    workouts.forEach((w) => w.exercises.forEach((e) => ids.add(e.exerciseId)));
    return config.exercises.filter((e) => ids.has(e.id));
  }, [workouts, config.exercises]);

  const [exerciseId, setExerciseId] = useState(exercisesWithData[0]?.id || "");
  useEffect(() => { if (!exerciseId && exercisesWithData[0]) setExerciseId(exercisesWithData[0].id); }, [exercisesWithData]);

  if (exercisesWithData.length === 0) {
    return <EmptyState icon={<TrendingUp size={30} color={T.textFaint} />} text="Enregistre quelques séances pour voir ta progression apparaître ici." />;
  }

  const data = workouts
    .filter((w) => w.exercises.some((e) => e.exerciseId === exerciseId))
    .sort((a, b) => a.date.localeCompare(b.date))
    .map((w) => {
      const ex = w.exercises.find((e) => e.exerciseId === exerciseId);
      const weights = ex.sets.map((s) => parseFloat(s.weight)).filter((n) => !isNaN(n));
      const maxW = weights.length ? Math.max(...weights) : 0;
      return { date: w.date, label: fmtDateShort(w.date), maxWeight: maxW, sets: ex.sets };
    });

  const first = data[0], lastPoint = data[data.length - 1];
  const delta = lastPoint && first ? lastPoint.maxWeight - first.maxWeight : 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Field label="Exercice">
        <select value={exerciseId} onChange={(e) => setExerciseId(e.target.value)} style={{ ...inputStyle, fontFamily: T.fontBody }}>
          {exercisesWithData.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
      </Field>

      {data.length > 0 && (
        <>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1, background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Charge max actuelle</div>
              <div style={{ fontFamily: T.fontMono, fontSize: 24, color: T.text, fontWeight: 700 }}>{lastPoint.maxWeight}kg</div>
            </div>
            <div style={{ flex: 1, background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Évolution</div>
              <div style={{ fontFamily: T.fontMono, fontSize: 24, color: delta > 0 ? T.green : delta < 0 ? T.accent : T.textMuted, fontWeight: 700 }}>
                {delta > 0 ? "+" : ""}{delta}kg
              </div>
            </div>
          </div>

          <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: "14px 8px 6px" }}>
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={data} margin={{ top: 6, right: 14, left: -18, bottom: 0 }}>
                <CartesianGrid stroke={T.border} vertical={false} />
                <XAxis dataKey="label" tick={{ fill: T.textFaint, fontSize: 11, fontFamily: T.fontBody }} axisLine={{ stroke: T.border }} tickLine={false} />
                <YAxis tick={{ fill: T.textFaint, fontSize: 11, fontFamily: T.fontMono }} axisLine={false} tickLine={false} width={40} />
                <Tooltip
                  contentStyle={{ background: T.bg2, border: `1px solid ${T.borderLight}`, borderRadius: 8, fontFamily: T.fontBody, fontSize: 12.5 }}
                  labelStyle={{ color: T.text }}
                  formatter={(v) => [`${v}kg`, "Charge max"]}
                />
                <Line type="monotone" dataKey="maxWeight" stroke={T.accent} strokeWidth={2.5}
                  dot={{ r: 3.5, fill: T.accent, strokeWidth: 0 }} activeDot={{ r: 5.5 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, overflow: "hidden" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${T.border}` }}>
                  <th style={{ textAlign: "left", padding: "9px 10px", fontSize: 10.5, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Date</th>
                  <th style={{ textAlign: "left", padding: "9px 10px", fontSize: 10.5, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Séries (poids × répét.)</th>
                </tr>
              </thead>
              <tbody>
                {[...data].reverse().map((d, i) => (
                  <tr key={i} style={{ borderBottom: i < data.length - 1 ? `1px solid ${T.border}` : "none" }}>
                    <td style={{ padding: "9px 10px", fontFamily: T.fontMono, fontSize: 12, color: T.textMuted, whiteSpace: "nowrap", verticalAlign: "top" }}>{d.label}</td>
                    <td style={{ padding: "9px 10px", fontFamily: T.fontMono, fontSize: 12, color: T.text }}>
                      {groupSets(d.sets).map((g, si) => (
                        <div key={si}>{fmtSetGroup(g)}</div>
                      ))}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* =================================================================
   TAB: POIDS (pesée)
==================================================================*/
const MOMENTS = [
  { id: "a-jeun", label: "À jeun (matin)" },
  { id: "midi", label: "Midi" },
  { id: "apres-midi", label: "Après-midi" },
  { id: "soir", label: "Soir" },
];
const momentLabel = (id) => MOMENTS.find((m) => m.id === id)?.label || MOMENTS[0].label;
const momentOrder = (id) => Math.max(0, MOMENTS.findIndex((m) => m.id === id));

function PoidsTab({ bodyweight, saveBodyweight }) {
  const [date, setDate] = useState(todayISO());
  const [weight, setWeight] = useState("");
  const [moment, setMoment] = useState("a-jeun");
  const [confirmDelete, setConfirmDelete] = useState(null);

  const sorted = [...bodyweight].sort((a, b) => b.date.localeCompare(a.date) || momentOrder(b.moment) - momentOrder(a.moment));
  const chartData = [...bodyweight]
    .sort((a, b) => a.date.localeCompare(b.date) || momentOrder(a.moment) - momentOrder(b.moment))
    .map((b) => ({ ...b, label: fmtDateShort(b.date) }));

  const add = async () => {
    const w = parseFloat(weight);
    if (isNaN(w) || w <= 0) return;
    const m = moment || "a-jeun";
    const existing = bodyweight.find((b) => b.date === date && b.moment === m);
    let next;
    if (existing) next = bodyweight.map((b) => (b.id === existing.id ? { ...b, weight: w } : b));
    else next = [...bodyweight, { id: uid(), date, weight: w, moment: m }];
    await saveBodyweight(next);
    setWeight("");
  };

  const del = async (id) => {
    await saveBodyweight(bodyweight.filter((b) => b.id !== id));
    setConfirmDelete(null);
  };

  const last = chartData[chartData.length - 1];
  const first = chartData[0];
  const delta = last && first ? +(last.weight - first.weight).toFixed(1) : 0;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end" }}>
          <Field label="Date">
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, width: 150 }} />
          </Field>
          <Field label="Poids (kg)">
            <input type="number" inputMode="decimal" step="0.1" min="0" placeholder="0.0" value={weight}
              onChange={(e) => setWeight(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()}
              style={{ ...numInputStyle, width: 110 }} />
          </Field>
        </div>
        <div style={{ marginTop: 12 }}>
          <Field label="Moment de la journée">
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {MOMENTS.map((m) => (
                <button key={m.id} onClick={() => setMoment(m.id)} style={{
                  fontSize: 12.5, fontFamily: T.fontBody, fontWeight: 600, padding: "6px 11px", borderRadius: 999, cursor: "pointer",
                  background: moment === m.id ? T.gold : T.bg2, color: moment === m.id ? "#1a1508" : T.textMuted,
                  border: `1px solid ${moment === m.id ? T.gold : T.borderLight}`,
                }}>{m.label}</button>
              ))}
            </div>
          </Field>
        </div>
        <Btn onClick={add} disabled={!weight} style={{ padding: "10px 16px", marginTop: 12 }}><Plus size={16} /> Ajouter</Btn>
      </div>

      {chartData.length === 0 ? (
        <EmptyState icon={<Scale size={30} color={T.textFaint} />} text="Note ton poids un jour de pesée pour commencer à suivre son évolution." />
      ) : (
        <>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1, background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Dernier relevé</div>
              <div style={{ fontFamily: T.fontMono, fontSize: 24, color: T.text, fontWeight: 700 }}>{last.weight}kg</div>
              <div style={{ fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, marginTop: 2 }}>{momentLabel(last.moment)}</div>
            </div>
            <div style={{ flex: 1, background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: 14 }}>
              <div style={{ fontSize: 11, color: T.textFaint, fontFamily: T.fontBody, textTransform: "uppercase", letterSpacing: 0.5 }}>Évolution totale</div>
              <div style={{ fontFamily: T.fontMono, fontSize: 24, color: delta > 0 ? T.gold : delta < 0 ? T.steel : T.textMuted, fontWeight: 700 }}>
                {delta > 0 ? "+" : ""}{delta}kg
              </div>
            </div>
          </div>

          <div style={{ background: T.card, border: `1px solid ${T.border}`, borderRadius: 12, padding: "14px 8px 6px" }}>
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={chartData} margin={{ top: 6, right: 14, left: -18, bottom: 0 }}>
                <CartesianGrid stroke={T.border} vertical={false} />
                <XAxis dataKey="label" tick={{ fill: T.textFaint, fontSize: 11, fontFamily: T.fontBody }} axisLine={{ stroke: T.border }} tickLine={false} />
                <YAxis tick={{ fill: T.textFaint, fontSize: 11, fontFamily: T.fontMono }} axisLine={false} tickLine={false} width={40} domain={["dataMin - 1", "dataMax + 1"]} />
                <Tooltip
                  contentStyle={{ background: T.bg2, border: `1px solid ${T.borderLight}`, borderRadius: 8, fontFamily: T.fontBody, fontSize: 12.5 }}
                  labelStyle={{ color: T.text }}
                  formatter={(v, n, p) => [`${v}kg`, momentLabel(p.payload.moment)]}
                />
                <Line type="monotone" dataKey="weight" stroke={T.gold} strokeWidth={2.5}
                  dot={{ r: 3.5, fill: T.gold, strokeWidth: 0 }} activeDot={{ r: 5.5 }} />
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {sorted.map((b) => (
              <div key={b.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: T.card, border: `1px solid ${T.border}`, borderRadius: 10, padding: "9px 12px" }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>

/* =================================================================
   CHRONOMÈTRE — durée totale auto + repos manuel + fractionné
==================================================================*/
let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) {
    try { sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
  return sharedAudioCtx;
}
function tone(freq, durationMs, gainPeak) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) throw new Error("no audio");
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(gainPeak || 0.25, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationMs / 1000);
    o.start(); o.stop(ctx.currentTime + durationMs / 1000 + 0.05);
  } catch (e) { /* audio indisponible */ }
  if (navigator.vibrate) navigator.vibrate(durationMs);
}
const beepLong = () => tone(640, 650, 0.28); // début d'une phase de travail (fractionné)
const beepShort = () => tone(950, 160, 0.22); // début d'une phase de repos (fractionné)
const beepFinish = () => { tone(880, 140); setTimeout(() => tone(1100, 140), 190); setTimeout(() => tone(1320, 320), 380); };

function fmtClock(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const PREP_SECONDS = 10;

function useChrono() {
  const [open, setOpen] = useState(false);

  // --- Durée totale de la séance (automatique dès qu'une séance est lancée) ---
  const [sessionActive, setSessionActive] = useState(false);
  const [sessionStartedAt, setSessionStartedAt] = useState(null);
  const [totalElapsedSec, setTotalElapsedSec] = useState(0);

  const startSession = (startedAt) => { setSessionStartedAt(startedAt); setSessionActive(true); };
  const stopSession = () => { setSessionActive(false); setSessionStartedAt(null); setTotalElapsedSec(0); };

  useEffect(() => {
    if (!sessionActive || !sessionStartedAt) return;
    const tick = () => setTotalElapsedSec(Math.max(0, (Date.now() - sessionStartedAt) / 1000));
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [sessionActive, sessionStartedAt]);

  // --- Séance fractionnée (HIIT) ---
  // Les champs sont stockés en texte libre (on peut les vider pour retaper), et bornés seulement à l'usage.
  const [intRounds, setIntRounds] = useState("8");
  const [intWork, setIntWork] = useState("30");
  const [intRest, setIntRest] = useState("10");
  const intRoundsNum = clamp(parseInt(intRounds, 10) || 8, 1, 12);
  const intWorkNum = clamp(parseInt(intWork, 10) || 30, 5, 60);
  const intRestNum = clamp(parseInt(intRest, 10) || 0, 0, 60);

  const [intPhase, setIntPhase] = useState("idle"); // idle | prep | work | rest | done
  const [intRound, setIntRound] = useState(0);
  const [intRemaining, setIntRemaining] = useState(0);
  const [intPhaseStartedAt, setIntPhaseStartedAt] = useState(null);
  const [intPhaseDuration, setIntPhaseDuration] = useState(0);
  const [intRunning, setIntRunning] = useState(false);
  const [intSessionStartedAt, setIntSessionStartedAt] = useState(null);
  const [intTotalElapsed, setIntTotalElapsed] = useState(0);

  const startInterval = () => {
    getAudioCtx(); // amorce l'audio pendant le geste de clic, sinon les bips ne jouent pas depuis le minuteur
    setIntRounds(String(intRoundsNum)); setIntWork(String(intWorkNum)); setIntRest(String(intRestNum));
    const now = Date.now();
    setIntPhase("prep"); setIntRound(0);
    setIntPhaseDuration(PREP_SECONDS); setIntPhaseStartedAt(now); setIntRemaining(PREP_SECONDS);
    setIntSessionStartedAt(now); setIntTotalElapsed(0);
    setIntRunning(true);
  };
  const stopInterval = () => {
    setIntRunning(false); setIntPhase("idle"); setIntRound(0); setIntRemaining(0); setIntPhaseStartedAt(null);
    setIntSessionStartedAt(null); setIntTotalElapsed(0);
  };

  useEffect(() => {
    if (!intRunning) return;
    const iv = setInterval(() => {
      const now = Date.now();
      if (intSessionStartedAt) setIntTotalElapsed(Math.max(0, (now - intSessionStartedAt) / 1000));
      const left = intPhaseDuration - (now - intPhaseStartedAt) / 1000;
      if (left > 0) { setIntRemaining(left); return; }

      if (intPhase === "prep") {
        setIntPhase("work"); setIntRound(1); setIntPhaseDuration(intWorkNum); setIntPhaseStartedAt(now); setIntRemaining(intWorkNum);
        beepLong();
      } else if (intPhase === "work") {
        if (intRound >= intRoundsNum) {
          setIntRunning(false); setIntPhase("done"); setIntRemaining(0);
          beepFinish();
        } else if (intRestNum > 0) {
          setIntPhase("rest"); setIntPhaseDuration(intRestNum); setIntPhaseStartedAt(now); setIntRemaining(intRestNum);
          beepShort();
        } else {
          setIntRound((r) => r + 1); setIntPhaseDuration(intWorkNum); setIntPhaseStartedAt(now); setIntRemaining(intWorkNum);
          beepLong();
        }
      } else if (intPhase === "rest") {
        setIntRound((r) => r + 1); setIntPhase("work"); setIntPhaseDuration(intWorkNum); setIntPhaseStartedAt(now); setIntRemaining(intWorkNum);
        beepLong();
      }
    }, 250);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [intRunning, intPhase, intPhaseStartedAt, intPhaseDuration, intRound, intRoundsNum, intWorkNum, intRestNum, intSessionStartedAt]);

  return {
    open, setOpen,
    sessionActive, totalElapsedSec, startSession, stopSession,
    intRounds, setIntRounds, intWork, setIntWork, intRest, setIntRest,
    intPhase, intRound, intRemaining, intRunning, intTotalElapsed, startInterval, stopInterval,
  };
}

      </div>
      <div style={{
        textAlign: "center", fontFamily: T.fontMono, fontSize: 34, fontWeight: 700, padding: "6px 0 14px", color: T.text,
      }}>{fmtClock(totalElapsedSec)}</div>
      <Btn variant="danger" onClick={onStopSession} style={{ width: "100%", justifyContent: "center", fontSize: 12.5 }}>
        <X size={13} /> Arrêter le chrono (la séance reste enregistrée)
      </Btn>
    </div>
  );
}

/* =================================================================
   APP
==================================================================*/
const TABS = [
  { id: "seance", label: "Séance", icon: Dumbbell },
  { id: "historique", label: "Historique", icon: History },
  { id: "calendrier", label: "Calendrier", icon: CalendarIcon },
  { id: "poids", label: "Poids", icon: Scale },
  { id: "progression", label: "Progression", icon: TrendingUp },
  { id: "reglages", label: "Réglages", icon: Settings },
];

function App() {
  const { config, workouts, bodyweight, templates, draft, saveConfig, saveWorkouts, saveBodyweight, saveTemplates, saveDraft, error, setError } = useStore();
  const [tab, setTab] = useState("seance");
  const [editingId, setEditingId] = useState(null);
  const chrono = useChrono();

  const goEdit = (id) => { setEditingId(id); setTab("seance"); };

  // Resynchronise le chrono total avec le brouillon persisté (reprise après rechargement de l'appli).
  useEffect(() => {
    if (editingId) return; // on ne touche pas au chrono pendant la modification d'une séance passée
    if (draft && draft.started) chrono.startSession(draft.startedAt);
    else chrono.stopSession();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [draft, editingId]);

  // Termine la séance en cours depuis le chrono : les données déjà enregistrées restent en historique,
  // seul le chrono et le brouillon repartent à zéro.
  const finishActiveSession = async () => {
    if (!config) return;
    const fresh = blankDraft(config);
    await saveDraft(fresh);
    chrono.stopSession();
    chrono.setOpen(false);
  };

  // Réutilise une ancienne séance : reprend le type et les exercices, avec des séries vierges, datée d'aujourd'hui.
  const duplicateWorkout = async (workout) => {
    const now = Date.now();
    const fresh = {
      id: uid(), date: todayISO(), sessionTypeId: workout.sessionTypeId, note: "",
      exercises: workout.exercises.map((e) => ({
        exerciseId: e.exerciseId, tempo: e.tempo || "Normal", tempoCustom: e.tempoCustom || "",
        sets: [{ reps: "", weight: "", rest: "" }],
      })),
      startedAt: now, durationMinutes: 0, durationManual: false, started: true,
    };
    setEditingId(null);
    await saveDraft(fresh);
    chrono.startSession(now);
    setTab("seance");
  };

  // Transforme une séance passée en modèle réutilisable (on demande un nom, pré-rempli mais modifiable).
  const saveWorkoutAsTemplate = async (workout) => {
    if (!config || !templates) return;
    const st = config.sessionTypes.find((s) => s.id === workout.sessionTypeId);
    const suggested = `${st?.name || "Séance"} — ${fmtDateShort(workout.date)}`;
    const name = window.prompt("Nom du modèle :", suggested);
    if (!name || !name.trim()) return;
    const tpl = {
      id: uid(), name: name.trim(), sessionTypeId: workout.sessionTypeId,
      exercises: workout.exercises.map((e) => ({ exerciseId: e.exerciseId, tempo: e.tempo || "Normal", tempoCustom: e.tempoCustom || "" })),
    };
    await saveTemplates([...templates, tpl]);
  };

  if (!config || !workouts || !bodyweight || !templates || draft === undefined) {
    return (
      <div style={{ minHeight: "100vh", background: T.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <FontLoader />
        <span style={{ color: T.textFaint, fontFamily: T.fontBody }}>Chargement…</span>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: T.bg, fontFamily: T.fontBody, color: T.text, paddingBottom: 84 }}>
      <FontLoader />
      <header style={{ padding: "16px 18px", borderBottom: `1px solid ${T.border}`, position: "sticky", top: 0, background: T.bg, zIndex: 5 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
            <Dumbbell size={22} color={T.accent} style={{ flexShrink: 0 }} />
            <h1 style={{
              fontFamily: T.fontDisplay, fontSize: 17, fontWeight: 600, letterSpacing: 0.4, margin: 0, textTransform: "uppercase",
              whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
            }}>Assistant musculation</h1>
          </div>
          {chrono.sessionActive && <ChronoButton chrono={chrono} />}
        </div>
      </header>

      <ChronoWidget chrono={chrono} onStopSession={finishActiveSession} />

      {error && (
        <div style={{ margin: "12px 18px 0", background: T.accentSoft, border: `1px solid ${T.accent}55`, borderRadius: 10, padding: "10px 12px", display: "flex", gap: 8, alignItems: "center" }}>
          <AlertCircle size={16} color={T.accent} />
          <span style={{ fontSize: 12.5, color: T.accent, fontFamily: T.fontBody, flex: 1 }}>{error}</span>
          <button onClick={() => setError(null)} style={{ background: "none", border: "none", color: T.accent, cursor: "pointer" }}><X size={14} /></button>
        </div>
      )}

      <main style={{ padding: "18px 16px", maxWidth: 640, margin: "0 auto" }}>
        {/* La séance reste montée en permanence (juste masquée) pour ne jamais perdre la saisie en cours. */}
        <div style={{ display: tab === "seance" ? "block" : "none" }}>
          <SeanceTab config={config} workouts={workouts} saveWorkouts={saveWorkouts} editingId={editingId} setEditingId={setEditingId} draft={draft} saveDraft={saveDraft} chrono={chrono} templates={templates} />
        </div>
        {tab === "historique" && <HistoriqueTab config={config} workouts={workouts} saveWorkouts={saveWorkouts} onEdit={goEdit} onDuplicate={duplicateWorkout} onSaveAsTemplate={saveWorkoutAsTemplate} />}
        {tab === "calendrier" && <CalendrierTab config={config} workouts={workouts} bodyweight={bodyweight} onEdit={goEdit} />}
        {tab === "poids" && <PoidsTab bodyweight={bodyweight} saveBodyweight={saveBodyweight} />}
        {tab === "progression" && <ProgressionTab config={config} workouts={workouts} />}
        {tab === "reglages" && <ReglagesTab config={config} saveConfig={saveConfig} templates={templates} saveTemplates={saveTemplates} workouts={workouts} saveWorkouts={saveWorkouts} bodyweight={bodyweight} saveBodyweight={saveBodyweight} />}
      </main>

      <nav style={{
        position: "fixed", bottom: 0, left: 0, right: 0, background: T.bg2, borderTop: `1px solid ${T.border}`,
        display: "flex", justifyContent: "space-around", padding: "8px 4px calc(8px + env(safe-area-inset-bottom))", zIndex: 10,
      }}>
        {TABS.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => { setTab(t.id); if (t.id !== "seance") setEditingId(null); }}
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", gap: 2, background: "none", border: "none",
                cursor: "pointer", color: active ? T.accent : T.textFaint, padding: "4px 2px", flex: 1, minWidth: 0,
              }}>
              <Icon size={19} strokeWidth={active ? 2.4 : 2} />
              <span style={{ fontSize: 9.5, fontFamily: T.fontBody, fontWeight: active ? 700 : 500, whiteSpace: "nowrap" }}>{t.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(App));

</script>
</body>
</html>
