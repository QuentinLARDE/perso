<script>
(function () {
  var PREFIX = "assistant-musculation:";
  window.storage = {
    get: function (key, shared) {
      return new Promise(function (resolve, reject) {
        var raw = localStorage.getItem(PREFIX + key);
        if (raw === null) { reject(new Error("not found")); return; }
        resolve({ key: key, value: raw, shared: !!shared });
      });
    },
    set: function (key, value, shared) {
      return new Promise(function (resolve, reject) {
        try {
          localStorage.setItem(PREFIX + key, value);
          resolve({ key: key, value: value, shared: !!shared });
        } catch (e) { reject(e); }
      });
    },
    delete: function (key, shared) {
      return new Promise(function (resolve) {
        localStorage.removeItem(PREFIX + key);
        resolve({ key: key, deleted: true, shared: !!shared });
      });
    },
    list: function (prefix, shared) {
      return new Promise(function (resolve) {
        var p = PREFIX + (prefix || "");
        var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; }).map(function (k) { return k.slice(PREFIX.length); });
        resolve({ keys: keys, prefix: prefix, shared: !!shared });
      });
    }
  };
  // Demande au navigateur de ne pas évincer les données de l'app quand l'espace
  // se fait rare. Sans réponse ou sans prise en charge, on continue normalement.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (deja) {
      if (!deja) navigator.storage.persist().catch(function () {});
    }).catch(function () {});
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
  setTimeout(function () {
    var el = document.getElementById("boot-msg");
    if (el) el.textContent = "Ça prend plus de temps que prévu — vérifie ta connexion et recharge la page.";
  }, 10000);
})();
</script>
